<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALUM Critical Path Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
#hdr{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:20px;box-shadow:0 2px 12px rgba(0,0,0,.4);position:sticky;top:0;z-index:100}
#hdr .logo{font-size:22px;font-weight:800;letter-spacing:2px;color:#e94560;flex-shrink:0}
#hdr .sub{font-size:11px;color:#a0aec0;margin-top:2px}
#hdr .sep{width:1px;height:36px;background:rgba(255,255,255,.15);margin:0 4px}
.hdr-field{display:flex;flex-direction:column;gap:2px}
.hdr-label{font-size:10px;color:#a0aec0;text-transform:uppercase;letter-spacing:.5px}
.hdr-val{font-size:13px;font-weight:600;color:#e2e8f0}
#hdr-date-input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 8px;border-radius:6px;font-size:13px;width:138px}
#hdr-date-input:focus{outline:none;border-color:#e94560}
#hdr-days-left{font-size:20px;font-weight:800;color:#ffd700}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.user-av{width:32px;height:32px;border-radius:50%;background:#e94560;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
#hdr-user-name{font-size:13px;color:#e2e8f0;cursor:pointer}
#hdr-user-name:hover{color:#ffd700}
.btn-new{background:#e94560;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-new:hover{background:#c73652}
#nav-wrap{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;align-items:center;gap:0;overflow-x:auto;position:sticky;top:65px;z-index:90}
.nav-tab{padding:12px 14px;font-size:12px;font-weight:600;color:#718096;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.nav-tab:hover{color:#1a1a2e}
.nav-tab.active{color:#e94560;border-bottom-color:#e94560}
#main-content{padding:20px 24px;min-height:calc(100vh - 110px)}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.section-title{font-size:18px;font-weight:700;color:#1a1a2e}
.task-count{background:#e2e8f0;color:#4a5568;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.filter-bar-left{display:flex;gap:8px;align-items:center;flex:1}
.search-wrap{position:relative;width:220px;flex-shrink:0}
.search-wrap .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a0aec0;font-size:13px;pointer-events:none}
.search-box{width:100%;padding:7px 10px 7px 28px;border:1px solid #e2e8f0;border-radius:7px;font-size:13px;background:#fff}
.search-box:focus{outline:none;border-color:#e94560}
.filter-sel{padding:7px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;background:#fff;cursor:pointer}
.filter-sel:focus{outline:none;border-color:#e94560}
.filter-showing{font-size:12px;color:#718096;margin-bottom:10px}
.tbl-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:#f7fafc;padding:9px 10px;text-align:left;font-weight:700;color:#4a5568;border-bottom:2px solid #e2e8f0;position:sticky;top:0;z-index:5;white-space:nowrap}
tbody tr{border-bottom:1px solid #f0f4f8;transition:background .1s}
tbody tr:hover{background:#f9fafe}
tbody tr.sub-row{background:#fafbff}
tbody tr.sub-row:hover{background:#f0f4ff}
td{padding:7px 10px;vertical-align:middle}
td.td-id{font-family:monospace;font-size:11px;color:#718096;white-space:nowrap}
td.td-disc{font-size:11px;color:#718096}
td.td-task{max-width:280px}
td.td-task .task-name{display:block;font-weight:500;color:#1a1a2e;line-height:1.35}
td.td-task .sub-indent{padding-left:18px;border-left:2px solid #e94560;margin-left:4px}
td.td-task .sub-tag{display:inline-block;background:#eef2ff;color:#5c6bc0;font-size:9px;border-radius:3px;padding:1px 4px;margin-left:4px;vertical-align:middle}
.task-name-wrap{display:inline-flex;align-items:center;gap:4px;width:100%}
.caret-btn{background:none;border:none;cursor:pointer;padding:0 2px;font-size:12px;color:#718096;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;flex-shrink:0}
.caret-btn:hover{background:#f0f2f5;color:#1a1a2e}
.caret-btn.expanded{color:#e94560}
.sub-count-badge{display:inline-block;background:#edf2ff;color:#4c6ef5;font-size:9px;border-radius:10px;padding:1px 6px;margin-left:6px;font-weight:600;vertical-align:middle}
tr.sub-row{background:#fafbff}
tr.sub-row td{font-size:12px}
td.td-num{text-align:center;color:#4a5568;white-space:nowrap}
td.td-date{white-space:nowrap;color:#4a5568;font-size:11px}
td.td-resp{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.td-resp input{width:100%;border:none;background:transparent;font-size:12px;color:#1a1a2e;padding:0;cursor:text}
td.td-resp input:focus{outline:1px solid #e94560;border-radius:3px;padding:1px 3px;background:#fff}
td.td-resp select{width:100%;border:none;background:transparent;font-size:12px;color:#1a1a2e;padding:0;cursor:pointer}
td.td-resp select:focus{outline:1px solid #e94560;border-radius:3px}
td.td-deps{max-width:160px}
.dep-btn{display:inline-block;background:#edf2ff;color:#4c6ef5;border:1px solid #c5d0fa;border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;white-space:nowrap}
.dep-btn:hover{background:#dbe4ff}
.dep-chips-cell{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.dep-chip-sm{background:#e8f5e9;color:#2e7d32;border-radius:3px;padding:1px 5px;font-size:10px;font-family:monospace}
.status-sel{padding:3px 6px;border-radius:5px;border:1px solid #e2e8f0;font-size:11px;font-weight:600;cursor:pointer;background:#fff;min-width:96px}
.s-ns{background:#fff3cd;color:#856404;border-color:#ffc107}
.s-ip{background:#cce5ff;color:#004085;border-color:#4299e1}
.s-co{background:#d4edda;color:#155724;border-color:#48bb78}
.s-bl{background:#f8d7da;color:#721c24;border-color:#fc8181}
.s-na{background:#e2e8f0;color:#4a5568;border-color:#a0aec0}
.cmt-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:#e2e8f0;color:#4a5568;font-size:10px;font-weight:700;cursor:pointer;padding:0 4px}
.cmt-badge.has-cmts{background:#e94560;color:#fff}
.cmt-badge:hover{opacity:.8}
.row-menu-btn{background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;font-size:16px;color:#a0aec0;line-height:1}
.row-menu-btn:hover{background:#e2e8f0;color:#4a5568}
.row-menu{position:fixed;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:9999;min-width:170px;padding:4px 0;display:none}
.row-menu.open{display:block}
.row-menu-item{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 14px;font-size:13px;color:#1a1a2e;cursor:pointer}
.row-menu-item:hover{background:#f7fafc}
.row-menu-danger{color:#e94560}
.row-menu-danger:hover{background:#fff5f5}
.row-menu-div{height:1px;background:#e2e8f0;margin:4px 0}
.pagination{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:center}
.pg-btn{padding:5px 11px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;cursor:pointer;font-size:12px}
.pg-btn:hover{background:#f7fafc}
.pg-btn:disabled{opacity:.4;cursor:default}
.pg-info{font-size:12px;color:#718096}
/* Modal / Task detail */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;width:680px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid #e2e8f0;display:flex;align-items:flex-start;gap:10px}
.modal-title{font-size:16px;font-weight:700;flex:1}
.modal-title-input{font-size:16px;font-weight:700;flex:1;width:100%;border:none;border-bottom:2px solid transparent;border-radius:4px;padding:2px 4px;resize:none;font-family:inherit;color:#1a1a2e;line-height:1.35;background:transparent;transition:border-color .15s}
.modal-title-input:hover{border-bottom-color:#e2e8f0;background:#f7fafc}
.modal-title-input:focus{outline:none;border-bottom-color:#e94560;background:#fff}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#718096;padding:2px 6px}
.modal-body{padding:20px 22px}
.modal-row{display:flex;gap:16px;margin-bottom:14px}
.modal-field{flex:1}
.modal-label{font-size:11px;color:#718096;font-weight:600;margin-bottom:4px;text-transform:uppercase}
.modal-val{font-size:14px;color:#1a1a2e}
.modal-input{width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:13px}
.modal-input:focus{outline:none;border-color:#e94560}
.modal-input.editable-field{border-color:#c5d0fa;background:#f8f9ff}
.modal-input.editable-field:focus{border-color:#4c6ef5;background:#fff}
.modal-save-btn{background:#2f855a;color:#fff;border:none;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s}
.modal-save-btn:hover{background:#276749}
.modal-footer{padding:14px 22px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:10px;background:#f8fafc;border-radius:0 0 12px 12px;position:sticky;bottom:0}
.cmt-thread{max-height:200px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.cmt-item{background:#f7fafc;border-radius:7px;padding:8px 10px}
.cmt-meta{font-size:10px;color:#718096;margin-bottom:3px;display:flex;justify-content:space-between}
.cmt-del{background:none;border:none;color:#e94560;cursor:pointer;font-size:10px;padding:0}
.cmt-text{font-size:13px;color:#1a1a2e}
.cmt-input-row{display:flex;gap:8px;margin-bottom:10px}
.cmt-input{flex:1;padding:7px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:13px}
.cmt-input:focus{outline:none;border-color:#e94560}
.btn-sm{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#c73652}
.btn-sec{background:#e2e8f0;color:#4a5568}
.btn-sec:hover{background:#cbd5e0}
.file-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.file-item{display:flex;align-items:center;gap:8px;background:#f7fafc;border-radius:6px;padding:6px 10px}
.file-name{flex:1;font-size:12px;color:#1a1a2e;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{font-size:10px;color:#718096}
.btn-link{background:none;border:none;color:#4c6ef5;cursor:pointer;font-size:11px;text-decoration:underline}
/* Dep picker */
#dep-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center}
#dep-picker-overlay.open{display:flex}
#dep-picker-box{background:#fff;border-radius:12px;width:520px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.dp-hdr{padding:16px 18px 12px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px}
.dp-title{font-size:15px;font-weight:700;flex:1}
.dp-filters{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid #f0f4f8;flex-wrap:wrap}
#dp-search{flex:1;min-width:140px;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px}
#dp-search:focus{outline:none;border-color:#e94560}
#dp-disc-filter{padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px}
#dp-chips{padding:8px 18px;display:flex;flex-wrap:wrap;gap:5px;min-height:36px;border-bottom:1px solid #f0f4f8}
.dp-chip{background:#e94560;color:#fff;border-radius:4px;padding:2px 7px;font-size:11px;display:flex;align-items:center;gap:4px}
.dp-chip-x{background:none;border:none;color:#fff;cursor:pointer;font-size:13px;line-height:1;padding:0 0 0 2px}
#dp-list{flex:1;overflow-y:auto;padding:8px 10px}
.dp-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .1s}
.dp-item:hover{background:#f7fafc}
.dp-item.sel{background:#eef2ff}
.dp-item-cb{width:16px;height:16px;flex-shrink:0;accent-color:#e94560}
.dp-item-id{font-family:monospace;font-size:11px;color:#718096;flex-shrink:0;width:70px}
.dp-item-name{font-size:12px;color:#1a1a2e;flex:1}
.dp-item-disc{font-size:10px;color:#a0aec0}
.dp-footer{padding:12px 18px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
#dp-done-btn{padding:7px 18px;background:#e94560;color:#fff;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:13px}
#dp-done-btn:hover{background:#c73652}
/* Move dialog */
#move-dialog{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:700;display:none;align-items:center;justify-content:center}
#move-dialog.open{display:flex}
#move-box{background:#fff;border-radius:10px;width:360px;padding:22px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.move-title{font-size:15px;font-weight:700;margin-bottom:14px}
.move-opt{display:block;width:100%;text-align:left;padding:9px 12px;border:1px solid #e2e8f0;border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:13px;background:#fff;transition:background .1s}
.move-opt:hover{background:#f0f4ff}
.move-opt.move-opt-cur{background:#eef2ff;color:#e94560;font-weight:600;border-color:#c5d0fa}
.move-cancel{margin-top:8px;padding:7px 14px;background:#e2e8f0;color:#4a5568;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600}
/* New task form */
#new-task-modal .modal-body{display:flex;flex-direction:column;gap:12px}
.subtask-banner{background:#eef2ff;border:1px solid #c5d0fa;border-radius:7px;padding:8px 12px;font-size:12px;color:#5c6bc0;margin-bottom:4px}
/* Timeline / Gantt */
#tl-outer{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px 20px}
.tl-filters{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tl-hint{font-size:12px;color:#a0aec0;flex:1}
.tl-scroll{overflow-x:auto;overflow-y:visible}
#gantt-svg{display:block;cursor:default}
/* Tooltip */
#gantt-tip{position:fixed;background:rgba(26,26,46,.95);color:#fff;padding:6px 10px;border-radius:6px;font-size:11px;pointer-events:none;z-index:9000;display:none;max-width:240px;line-height:1.5}
/* Dur input */
.dur-input{width:64px;padding:3px 6px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px}
.dur-input:focus{outline:none;border-color:#e94560}
/* Disc badge */
.disc-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;background:#edf2ff;color:#4c6ef5}
/* Dashboard */
.dash-wrap{display:flex;flex-direction:column;gap:18px}
.dash-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dash-card-title{font-size:11px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.7px;margin-bottom:14px}
/* Overall progress card */
.ovr-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ovr-title{font-size:14px;font-weight:700;color:#1a1a2e}
.ovr-pct{font-size:28px;font-weight:800}
.ovr-bar-track{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;position:relative;margin-bottom:10px}
.ovr-bar-seg{position:absolute;top:0;height:100%}
.ovr-legend{display:flex;gap:18px;flex-wrap:wrap}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#4a5568}
/* Stat cards row */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center}
.stat-num{font-size:38px;font-weight:800;line-height:1;margin-bottom:6px}
.stat-lbl{font-size:10px;font-weight:700;color:#a0aec0;text-transform:uppercase;letter-spacing:.8px}
/* Discipline cards grid */
.disc-section-hdr{font-size:11px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}
.disc-cards-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.disc-card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;transition:box-shadow .15s,transform .1s}
.disc-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-1px)}
.disc-card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.disc-card-name{font-size:12px;font-weight:700;color:#1a1a2e;line-height:1.3}
.disc-card-pct{font-size:18px;font-weight:800}
.disc-card-bar-track{height:5px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:8px}
.disc-card-bar-fill{height:100%;border-radius:4px}
.disc-card-stats{display:flex;gap:8px;flex-wrap:wrap}
.disc-stat-item{display:flex;align-items:center;gap:3px;font-size:10px;color:#718096}
.disc-stat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* Bar chart */
.chart-wrap{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chart-legend{display:flex;gap:18px;margin-top:14px}
.disc-link{cursor:pointer}
.disc-link:hover .disc-progress-name{color:#e94560}
/* Timeline subtask toggle */
.tl-subtask-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid #e2e8f0;border-radius:7px;background:#fff;font-size:12px;font-weight:600;color:#4a5568;cursor:pointer;transition:all .15s;white-space:nowrap}
.tl-subtask-btn:hover{border-color:#4c6ef5;color:#4c6ef5;background:#edf2ff}
.tl-subtask-btn.active{border-color:#4c6ef5;color:#4c6ef5;background:#edf2ff}
/* Phase filter pills */
.phase-bar{display:flex;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap;margin-bottom:10px}
.phase-pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;white-space:nowrap}
.phase-pill:hover{opacity:.85;transform:translateY(-1px)}
.phase-pill.active{box-shadow:0 2px 8px rgba(0,0,0,.2)}
/* Project Hub */
.hub-wrap{min-height:100vh;background:#f0f2f5;padding:28px 28px}
.hub-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.hub-title{font-size:22px;font-weight:800;color:#1a1a2e}
.hub-sub{font-size:13px;color:#718096;margin-top:3px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.hub-card{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:0 1px 6px rgba(0,0,0,.08);cursor:pointer;transition:box-shadow .15s,transform .1s;border-top:4px solid #e94560;position:relative}
.hub-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.13);transform:translateY(-2px)}
.hub-card-name{font-size:15px;font-weight:800;color:#1a1a2e;margin-bottom:4px}
.hub-card-open{font-size:12px;color:#718096;margin-bottom:14px}
.hub-card-pct{font-size:32px;font-weight:900;color:#e94560;line-height:1;margin-bottom:2px}
.hub-card-pct-lbl{font-size:10px;font-weight:700;color:#a0aec0;text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}
.hub-card-bar-track{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:12px}
.hub-card-bar-fill{height:100%;border-radius:4px;background:#e94560}
.hub-card-stats{display:flex;gap:12px;font-size:11px;color:#718096}
.hub-card-del{position:absolute;top:10px;right:10px;background:none;border:none;color:#cbd5e0;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.hub-card-del:hover{background:#fff5f5;color:#e94560}
.hub-card-role{position:absolute;top:10px;right:10px;background:#edf2f7;color:#4a5568;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:10px}
.hub-new-card{background:#f7fafc;border:2px dashed #cbd5e0;border-radius:12px;padding:20px 22px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;gap:8px}
.hub-new-card:hover{border-color:#e94560;background:#fff5f5}
.hub-new-icon{font-size:32px;color:#cbd5e0}
.hub-new-card:hover .hub-new-icon{color:#e94560}
.hub-new-lbl{font-size:13px;font-weight:700;color:#a0aec0}
.hub-new-card:hover .hub-new-lbl{color:#e94560}
.hub-template-btn{padding:8px 18px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.hub-template-btn:hover{background:#16213e}
/* New project modal */
.np-modal{background:#fff;border-radius:14px;width:440px;max-width:95vw;padding:30px;box-shadow:0 10px 50px rgba(0,0,0,.3)}
.np-title{font-size:18px;font-weight:800;color:#1a1a2e;margin-bottom:6px}
.np-sub{font-size:13px;color:#718096;margin-bottom:22px}
.np-field{margin-bottom:16px}
.np-label{font-size:11px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.np-input{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px}
.np-input:focus{outline:none;border-color:#e94560}
.np-actions{display:flex;gap:10px;margin-top:22px}
.np-btn-primary{flex:1;padding:11px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.np-btn-primary:hover{background:#c73652}
.np-btn-sec{padding:11px 18px;background:#e2e8f0;color:#4a5568;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
/* Auth screen */
#auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);padding:20px}
.auth-card{background:#fff;border-radius:14px;width:400px;max-width:95vw;padding:34px;box-shadow:0 10px 50px rgba(0,0,0,.3)}
.auth-logo{font-size:26px;font-weight:800;letter-spacing:3px;color:#e94560;text-align:center;margin-bottom:4px}
.auth-sub{font-size:12px;color:#718096;text-align:center;margin-bottom:24px}
.auth-error{background:#fff5f5;color:#c53030;border:1px solid #feb2b2;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:16px}
.auth-success{background:#f0fff4;color:#22543d;border:1px solid #9ae6b4;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:16px}
.auth-toggle{text-align:center;font-size:13px;color:#718096;margin-top:18px}
.auth-toggle a{color:#e94560;font-weight:600;cursor:pointer;text-decoration:none}
.auth-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#718096;font-size:13px;background:#f0f2f5}
/* User menu */
.user-menu{display:none;position:absolute;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:180px;padding:6px;z-index:300}
.user-menu.show{display:block}
.user-menu-email{padding:8px 12px;font-size:11px;color:#a0aec0;border-bottom:1px solid #e2e8f0;margin-bottom:4px;word-break:break-all}
.user-menu-item{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:none;border-radius:6px;font-size:13px;font-weight:600;color:#4a5568;cursor:pointer}
.user-menu-item:hover{background:#f7fafc;color:#1a1a2e}
.user-menu-item.danger:hover{background:#fff5f5;color:#e94560}
/* Back button */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#e2e8f0;color:#4a5568;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-right:8px}
.back-btn:hover{background:#cbd5e0}
/* Phase progress mini-bars on hub card */
.hub-phase-row{display:flex;align-items:center;gap:5px;margin-top:8px}
.hub-phase-seg{height:4px;border-radius:2px;flex-shrink:0}

function _emailToName(email){
  if(!email)return '';
  const local=email.split('@')[0];
  return local.split(/[._-]+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
async function _loadProjectMembers(projectId){
  if(!sb||!projectId){_projectMembers=[];return _projectMembers;}
  const{data,error}=await sb.from('alum_project_members').select('email,user_id,role,discipline').eq('project_id',projectId).order('email');
  if(error){console.error('ALUM load members error:',error.message);_projectMembers=[];return _projectMembers;}
  _projectMembers=data||[];
  return _projectMembers;
}
// Build <option> list for a "Responsible" dropdown, preserving any existing
// value even if that person is no longer (or never was) a project member.
function _respOptionsHtml(selected){
  selected=selected||'';
  let opts='<option value="">— Unassigned —</option>';
  const emails=_projectMembers.map(m=>m.email);
  if(selected&&!emails.includes(selected))emails.push(selected);
  emails.forEach(email=>{
    opts+=`<option value="${escHtml(email)}"${email===selected?' selected':''}>${escHtml(_emailToName(email)||email)}</option>`;
  });
  return opts;
}

  if(od){try{openingDate=new Date(od);}catch(e){}}
}
function _rebuildMap(){TASK_MAP={};TASKS.forEach(t=>TASK_MAP[t.id]=t);}

// ── SUPABASE TASK SYNC ───────────────────────────────────
function _taskToRow(t){
  return{
    id:t.id,project_id:currentProjectId,discipline:t.discipline,item:t.item,
    months_out:(t.monthsOut==null?null:t.monthsOut),phase:t.phase||null,
    responsible:t.responsible||'',status:t.status||'Not Started',deps:t.deps||[],
    duration:t.duration||null,parent_id:t.parentId||null,is_custom:!!t._custom,
    updated_by:getCurrentUser(),updated_at:new Date().toISOString()
  };
}
function _rowToTask(r){
  return{
    id:r.id,discipline:r.discipline,item:r.item,
    monthsOut:(r.months_out==null?null:Number(r.months_out)),
    phase:r.phase||null,responsible:r.responsible||'',status:r.status||'Not Started',
    deps:r.deps||[],duration:r.duration||null,parentId:r.parent_id||null,_custom:!!r.is_custom
  };
}
function _scheduleSupabaseSync(){
  if(_syncTimer)clearTimeout(_syncTimer);
  _syncTimer=setTimeout(_syncTasksToSupabase,800);
}
async function _syncTasksToSupabase(){
  if(!sb||!currentProjectId)return;
  const rows=TASKS.map(_taskToRow);
  if(rows.length>0){
    const{error}=await sb.from('alum_tasks').upsert(rows,{onConflict:'project_id,id'});
    if(error)console.error('ALUM task sync error:',error.message);
  }
  if(_pendingDeletes.size>0){
    const ids=[..._pendingDeletes];
    _pendingDeletes.clear();
    const{error:delErr}=await sb.from('alum_tasks').delete().eq('project_id',currentProjectId).in('id',ids);
    if(delErr)console.error('ALUM task delete sync error:',delErr.message);
  }
}
async function _loadTasksFromSupabase(projectId){
  if(!sb)return null;
  const{data,error}=await sb.from('alum_tasks').select('*').eq('project_id',projectId);
  if(error){console.error('ALUM load tasks error:',error.message);return null;}
  return data;
}
async function _seedTasksToSupabase(projectId,taskList){
  if(!sb)return;
  const rows=taskList.map(t=>({
    id:t.id,project_id:projectId,discipline:t.discipline,item:t.item,
    months_out:(t.monthsOut==null?null:t.monthsOut),phase:t.phase||null,
    responsible:t.responsible||'',status:t.status||'Not Started',deps:t.deps||[],
    duration:t.duration||null,parent_id:t.parentId||null,is_custom:!!t._custom,
    updated_by:getCurrentUser(),updated_at:new Date().toISOString()
  }));
  // Insert in chunks to stay well under request size limits
  const CHUNK=200;
  for(let i=0;i<rows.length;i+=CHUNK){
    const chunk=rows.slice(i,i+CHUNK);
    const{error}=await sb.from('alum_tasks').upsert(chunk,{onConflict:'project_id,id'});
    if(error){console.error('ALUM seed tasks error:',error.message);break;}
  }
}

// ── REALTIME ─────────────────────────────────────────────
function _subscribeTaskChannel(projectId){
  if(!sb)return;
  _unsubscribeTaskChannel();
  _taskChannel=sb.channel('alum_tasks_'+projectId)
    .on('postgres_changes',{event:'*',schema:'public',table:'alum_tasks',filter:'project_id=eq.'+projectId},handleTaskRealtime)
    .subscribe();
}
function _unsubscribeTaskChannel(){
  if(_taskChannel&&sb){sb.removeChannel(_taskChannel);}
  _taskChannel=null;
}
function handleTaskRealtime(payload){
  if(appMode!=='project'||!currentProjectId)return;
  _applyingRemote=true;
  try{
    if(payload.eventType==='DELETE'){
      const oldId=payload.old&&payload.old.id;
      if(oldId){TASKS=TASKS.filter(t=>t.id!==oldId);}
    }else{
      const incoming=_rowToTask(payload.new);
      const existing=TASK_MAP[incoming.id];
      if(existing)Object.assign(existing,incoming);
      else TASKS.push(incoming);
    }
    _rebuildMap();
    localStorage.setItem(_projectTasksKey(),JSON.stringify(_taskRowsForStorage()));
    render();
  }finally{
    _applyingRemote=false;
  }
}

// ── DATE HELPERS ─────────────────────────────────────────
function calcBeginDateObj(monthsOut){
  if(monthsOut==null)return null;
  const d=new Date(openingDate);
  d.setDate(d.getDate()-Math.round(monthsOut*30.44));
  return d;
}
function fmt(d){
  if(!d)return '—';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function calcBeginDate(monthsOut){return fmt(calcBeginDateObj(monthsOut));}
function calcEndDate(monthsOut,duration){
  if(monthsOut==null||!duration)return '—';
  const d=calcBeginDateObj(monthsOut);
  if(!d)return '—';
  d.setDate(d.getDate()+duration);
  return fmt(d);
}
function durationLabel(days){
  if(!days||days<=0)return '';
  if(days%7===0)return days/7+'w';
  if(days>=14){const w=Math.floor(days/7);const r=days%7;return w+'w'+(r?'+'+r+'d':'');}
  return days+'d';
}
// Convert a Date → "YYYY-MM-DD" string for <input type="date">
function dateToInputVal(d){
  if(!d)return '';
  const y=d.getFullYear();
  const mo=String(d.getMonth()+1).padStart(2,'0');
  const dy=String(d.getDate()).padStart(2,'0');
  return `${y}-${mo}-${dy}`;
}
// Convert a "YYYY-MM-DD" string → monthsOut (distance in months before opening)
function dateToMonthsOut(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr+'T12:00:00');
  const days=(openingDate-d)/(1000*60*60*24);
  return Math.round(days/30.44*100)/100;
}
function daysUntilOpen(){
  const now=new Date();now.setHours(0,0,0,0);
  const diff=Math.round((openingDate-now)/(1000*60*60*24));
  return diff;
}

// ── PHASE HELPER ─────────────────────────────────────────
function getPhase(mo){
  if(mo==null)return 'Pre-Opening';
  if(mo>=24)return 'Discovery & Acquisition';
  if(mo>=12)return 'Development';
  if(mo>=6)return 'Construction';
  if(mo>0)return 'Pre-Opening';
  return 'Grand Opening';
}

async function doSignUp(){
  const name=(document.getElementById('auth-name').value||'').trim();
  const email=(document.getElementById('auth-email').value||'').trim();
  const password=document.getElementById('auth-password').value||'';
  if(!name||!email||!password){renderAuthScreen('Please fill in all fields.');return;}
  if(password.length<6){renderAuthScreen('Password must be at least 6 characters.');return;}
  if(!sb){renderAuthScreen('Supabase client failed to load. Check your internet connection and reload.');return;}
  _setAuthBusy('Creating account…');
  const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
  if(error){renderAuthScreen(error.message);return;}
  if(data.session){
    await _onAuthed(data.session.user);
  }else{
    authMode='signin';
    renderAuthScreen(null,'Account created! Check your email to confirm, then sign in.');
  }
}
async function doSignIn(){
  const email=(document.getElementById('auth-email').value||'').trim();
  const password=document.getElementById('auth-password').value||'';
  if(!email||!password){renderAuthScreen('Please enter your email and password.');return;}
  if(!sb){renderAuthScreen('Supabase client failed to load. Check your internet connection and reload.');return;}
  _setAuthBusy('Signing in…');
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){renderAuthScreen(error.message);return;}
  await _onAuthed(data.user);
}
async function doSignOut(){
  closeUserMenu();
  if(sb)await sb.auth.signOut();
  currentUser=null;
  authMode='signin';
  renderAuthScreen();
}
async function _onAuthed(user){
  currentUser={id:user.id,email:user.email,name:(user.user_metadata&&user.user_metadata.full_name)||(user.email||'').split('@')[0]};
  localStorage.setItem('alum_user',currentUser.name);
  startApp();
}

function closeUserMenu(){
  const menu=document.getElementById('user-menu');
  if(menu)menu.classList.remove('show');
}

// ── INIT APP (runs once on page load) ─────────────────────
function initApp(){
  if(!sb){
    document.getElementById('app').innerHTML='<div class="auth-loading">Could not load Supabase client. Check your internet connection and reload the page.</div>';
    return;
  }
  document.getElementById('app').innerHTML='<div class="auth-loading">Loading…</div>';
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){
      currentUser=null;authMode='signin';renderAuthScreen();
    }
  });
  sb.auth.getSession().then(({data})=>{
    if(data&&data.session&&data.session.user){
      _onAuthed(data.session.user);
    }else{
      renderAuthScreen();
    }
  });
}

// ── START APP (runs once, after sign-in) ──────────────────
function startApp(){
  // Build persistent overlays (dep picker, row menu, move dialog, gantt tip) once
  _buildDepPickerOverlay();

  // Build row menu container (once — populated dynamically in openRowMenu based on role)
  const rm=document.createElement('div');
  rm.id='row-menu';
  rm.className='row-menu';
  document.body.appendChild(rm);

  // Build move dialog (once)
  const md=document.createElement('div');
  md.id='move-dialog';
  md.innerHTML=`<div id="move-box">
    <div class="move-title">Move Task To Discipline</div>
    <div id="move-opts"></div>
    <button class="move-cancel" onclick="closeMoveDialog()">Cancel</button>
  </div>`;
  document.body.appendChild(md);

  // Close row menu on outside click
  document.addEventListener('click',function(e){
    const rm=document.getElementById('row-menu');
    if(rm&&!rm.contains(e.target)&&!e.target.classList.contains('row-menu-btn')){
      closeRowMenu();
    }
  });

  // Gantt tooltip
  const tip=document.createElement('div');
  tip.id='gantt-tip';
  document.body.appendChild(tip);

  // Build user menu (once)
  const um=document.createElement('div');
  um.id='user-menu';
  um.className='user-menu';
  um.innerHTML=`
    <div class="user-menu-email" id="user-menu-email"></div>
    <button class="user-menu-item" onclick="editUserName()">✎ Edit Display Name</button>
    <button class="user-menu-item danger" onclick="doSignOut()">⎋ Sign Out</button>`;
  document.body.appendChild(um);
  document.addEventListener('click',function(e){
    const um=document.getElementById('user-menu');
    if(um&&!um.contains(e.target)&&!e.target.closest('.user-av')&&e.target.id!=='hdr-user-name'){
      closeUserMenu();
    }
  });

  // Start at Project Hub
  renderHub();
}

// ── RENDER HUB ────────────────────────────────────────────
async function renderHub(){
  appMode='hub';
  currentProjectId=null;
  currentProjectRole=null;
  currentProjectDiscipline=null;
  const app=document.getElementById('app');
  app.innerHTML='<div class="auth-loading">Loading your projects…</div>';
  await _refreshProjects();
  await _migrateLegacyProjects();
  app.innerHTML='';
  app.appendChild(await buildProjectHub());
}

// ── ONE-TIME MIGRATION: bring projects created before Supabase sync existed
// (stored only in this browser's localStorage) into Supabase, so they show
// up in the shared Project Hub and sync for everyone.
async function _migrateLegacyProjects(){
  if(!sb||!currentUser)return;
  if(localStorage.getItem('alum_migrated_to_supabase'))return;
  let legacy=[];
  try{legacy=JSON.parse(localStorage.getItem('alum_projects')||'[]');}catch(e){}
  if(!Array.isArray(legacy)||legacy.length===0){
    localStorage.setItem('alum_migrated_to_supabase','1');
    return;
  }
  const existingIds=new Set(_myProjects.map(p=>p.id));
  let migratedAny=false;
  for(const proj of legacy){
    if(!proj||!proj.id||existingIds.has(proj.id))continue;
    let tasks=[];
    try{tasks=JSON.parse(localStorage.getItem('alum_project_'+proj.id+'_tasks')||'[]');}catch(e){}
    const dateStr=localStorage.getItem('alum_project_'+proj.id+'_opening_date')||proj.openingDate||null;
    const ok=await _createProjectRemote(proj.id,proj.name||'Untitled Project',dateStr,true);
    if(ok){
      if(tasks.length)await _seedTasksToSupabase(proj.id,tasks);
      migratedAny=true;
    }
  }
  localStorage.setItem('alum_migrated_to_supabase','1');
  if(migratedAny)await _refreshProjects();
}

// ── OPEN WORKSPACE (template or project) ─────────────────
async function openWorkspace(projectId){
  // projectId = null → template editor, string → project
  _unsubscribeTaskChannel();
  currentProjectId=projectId||null;
  appMode=projectId?'project':'template';
  TASK_MAP={};

  if(projectId){
    const proj=_myProjects.find(p=>p.id===projectId);
    currentProjectRole=(proj&&proj.role)||'viewer';
    currentProjectDiscipline=(proj&&proj.discipline)||null;
    openingDate=proj&&proj.openingDate?new Date(proj.openingDate):new Date('2027-08-01');

    document.getElementById('app').innerHTML='<div class="auth-loading">Loading project…</div>';

    let rows=await _loadTasksFromSupabase(projectId);
    if(rows&&rows.length>0){
      TASKS=rows.map(_rowToTask);
    }else{
      // Fallback: local cache (offline) or, for brand-new projects, an empty set
      const cached=localStorage.getItem(_projectTasksKey());
      if(cached){
        try{TASKS=JSON.parse(cached).map(t=>({...t,deps:t.deps||[]}));}catch(e){TASKS=[];}
      }else{
        TASKS=[];
      }
    }
    _rebuildMap();
    localStorage.setItem(_projectTasksKey(),JSON.stringify(_taskRowsForStorage()));
    await _loadProjectMembers(projectId);

    const label=(proj&&proj.name)||'Project';
    _buildWorkspaceShell(label);
    _subscribeTaskChannel(projectId);
  }else{
    currentProjectRole=null;
    currentProjectDiscipline=null;
    _projectMembers=[];
    // Reset TASKS to fresh template clone
    TASKS=[...TASKS_RAW.map(t=>({...t,deps:[...t.deps],phase:t.phase||getPhase(t.monthsOut)}))];
    openingDate=new Date('2027-08-01');
    _loadState();
    _rebuildMap();
    _buildWorkspaceShell('Template Editor');
  }

  // Restore opening date display
  const di=document.getElementById('hdr-date-input');
  if(di)di.value=openingDate.toISOString().slice(0,10);
  document.getElementById('hdr-days-left').textContent=daysUntilOpen();

  currentView='dashboard';
  phaseFilter='';
  render();
}

function goToHub(){
  _unsubscribeTaskChannel();
  renderHub();
}

// ── RENDER ────────────────────────────────────────────────
function render(){
  document.querySelectorAll('.nav-tab').forEach(tab=>{
    tab.classList.toggle('active', tab.dataset.view===currentView);
  });

  const mc=document.getElementById('main-content');
  mc.innerHTML='';
  if(currentView==='dashboard'){
    mc.appendChild(buildDashboard());
  } else if(currentView==='timeline'){
    mc.appendChild(buildTimeline());
  } else {
    let tasks=TASKS;
    mc.appendChild(buildTableView(tasks));
  }
}

function switchView(view,disc,el){
  currentView=view;
  currentDisc=disc;
  currentPage=0;
  searchQuery='';
  statusFilter='';
  discFilter='';
  render();
}

// ── PROJECT HUB ───────────────────────────────────────────
async function buildProjectHub(){
  const wrap=document.createElement('div');
  wrap.className='hub-wrap';

  const projects=_getProjects();

  // Try to fetch current task stats for all projects in one query
  let tasksByProject={};
  if(sb&&projects.length>0){
    try{
      const ids=projects.map(p=>p.id);
      const{data,error}=await sb.from('alum_tasks').select('project_id,status,parent_id,phase,months_out').in('project_id',ids);
      if(!error&&data){
        data.forEach(r=>{(tasksByProject[r.project_id]=tasksByProject[r.project_id]||[]).push(r);});
      }
    }catch(e){console.error('ALUM hub stats error:',e);}
  }

  // Compute stats for each project
  const projectStats=projects.map(proj=>{
    let ptasks=tasksByProject[proj.id];
    if(ptasks){
      ptasks=ptasks.map(r=>({parentId:r.parent_id,status:r.status,phase:r.phase,monthsOut:r.months_out}));
    }else{
      try{ptasks=JSON.parse(localStorage.getItem('alum_project_'+proj.id+'_tasks')||'[]');}catch(e){ptasks=[];}
    }
    const parents=ptasks.filter(t=>!t.parentId);
    const total=parents.length||ptasks.length;
    const completed=ptasks.filter(t=>t.status==='Completed').length;
    const pct=total>0?Math.round((completed/total)*100):0;
    const odStr=proj.openingDate||localStorage.getItem('alum_project_'+proj.id+'_opening_date');
    const od=odStr?new Date(odStr):null;
    const now=new Date();now.setHours(0,0,0,0);
    const daysLeft=od?Math.round((od-now)/(1000*60*60*24)):null;
    // Phase breakdown
    const phaseCounts={};
    PHASES.forEach(ph=>phaseCounts[ph]=0);
    ptasks.forEach(t=>{const ph=t.phase||getPhase(t.monthsOut);phaseCounts[ph]=(phaseCounts[ph]||0)+1;});
    return {...proj,total:ptasks.length,completed,pct,daysLeft,odStr,phaseCounts};
  });

  // Header
  const hdr=document.createElement('div');
  hdr.className='hub-header';
  hdr.innerHTML=`
    <div>
      <div class="logo" style="font-size:28px;color:#e94560">ALUM</div>
      <div class="hub-title" style="margin-top:4px">Project Hub</div>
      <div class="hub-sub">Select a project or create a new one</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;color:#a0aec0">${projects.length} active project${projects.length!==1?'s':''}</span>
      <button class="hub-template-btn" onclick="openWorkspace(null)">✎ Edit Template</button>
      <div class="user-av" id="hdr-user-av" onclick="toggleUserMenu(event)" title="${escHtml(getCurrentUser())}">${escHtml(getCurrentUser()[0].toUpperCase())}</div>
    </div>`;
  wrap.appendChild(hdr);

  // Grid
  const grid=document.createElement('div');
  grid.className='hub-grid';

  // New project card
  const newCard=document.createElement('div');
  newCard.className='hub-new-card';
  newCard.onclick=()=>openNewProjectModal();
  newCard.innerHTML=`<div class="hub-new-icon">＋</div><div class="hub-new-lbl">New Project</div><div style="font-size:11px;color:#a0aec0;margin-top:4px">Generate from template</div>`;
  grid.appendChild(newCard);

  // Project cards
  projectStats.forEach(proj=>{
    const col=proj.pct===100?'#38a169':proj.pct>50?'#3182ce':'#e94560';
    const daysLbl=proj.daysLeft!=null?(proj.daysLeft>=0?proj.daysLeft+' days to open':'Opened '+Math.abs(proj.daysLeft)+'d ago'):'—';
    const card=document.createElement('div');
    card.className='hub-card';
    card.style.borderTopColor=col;

    // Phase mini bar
    const total=proj.total||1;
    const phaseBarSegs=PHASES.map(ph=>{
      const w=Math.round((proj.phaseCounts[ph]||0)/total*100);
      return w>0?`<div class="hub-phase-seg" style="background:${PHASE_COLORS[ph]};width:${w}%;min-width:4px" title="${ph}: ${proj.phaseCounts[ph]}"></div>`:'';
    }).join('');

    card.innerHTML=`
      ${proj.role==='owner'?`<button class="hub-card-del" onclick="event.stopPropagation();confirmDeleteProject('${proj.id}')" title="Delete project">✕</button>`:''}
      ${proj.role&&proj.role!=='owner'?`<div class="hub-card-role" title="Your role on this project">${escHtml(proj.role)}${proj.discipline?' · '+escHtml(proj.discipline):''}</div>`:''}
      <div class="hub-card-name">${escHtml(proj.name)}</div>
      <div class="hub-card-open">${proj.odStr?new Date(proj.odStr).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'No opening date'}</div>
      <div class="hub-card-pct" style="color:${col}">${proj.pct}%</div>
      <div class="hub-card-pct-lbl">Complete</div>
      <div class="hub-card-bar-track"><div class="hub-card-bar-fill" style="width:${proj.pct}%;background:${col}"></div></div>
      <div class="hub-phase-row">${phaseBarSegs}</div>
      <div class="hub-card-stats" style="margin-top:8px">
        <span>${proj.total} tasks</span>
        <span>${proj.completed} done</span>
        <span>${daysLbl}</span>
      </div>`;
    card.onclick=()=>openWorkspace(proj.id);
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  return wrap;
}

async function confirmDeleteProject(id){
  const proj=_getProjects().find(p=>p.id===id);
  if(!proj)return;
  if(proj.role!=='owner'){alert('Only the project owner can delete this project.');return;}
  if(!confirm(`Delete project "${proj.name}"? This cannot be undone.`))return;
  const ok=await _deleteProjectRemote(id);
  if(ok){
    localStorage.removeItem('alum_project_'+id+'_tasks');
    localStorage.removeItem('alum_project_'+id+'_opening_date');
    await _refreshProjects();
    renderHub();
  }
}

async function submitNewProject(){
  const nameEl=document.getElementById('np-name');
  const dateEl=document.getElementById('np-date');
  const name=(nameEl&&nameEl.value.trim())||'';
  const dateStr=(dateEl&&dateEl.value)||'';
  if(!name){alert('Please enter a project name.');return;}
  if(!dateStr){alert('Please select an opening date.');return;}

  const id='proj_'+Date.now();

  // Clone template tasks and recalculate dates relative to new opening date
  const clonedTasks=TASKS_RAW.map(t=>({
    ...t,
    deps:[...t.deps],
    phase:t.phase||getPhase(t.monthsOut),
    status:'Not Started',
    responsible:t.responsible||'',
    duration:null,
    _custom:false
  }));

  const submitBtn=document.querySelector('#np-modal-bg .np-btn-primary');
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Generating…';}

  // Create project + ownership row in Supabase
  const ok=await _createProjectRemote(id,name,dateStr);
  if(!ok){
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Generate Project →';}
    return;
  }

  // Seed the cloned tasks to Supabase, with a local cache as a fallback
  await _seedTasksToSupabase(id,clonedTasks);
  localStorage.setItem('alum_project_'+id+'_tasks',JSON.stringify(clonedTasks));
  localStorage.setItem('alum_project_'+id+'_opening_date',dateStr);

  await _refreshProjects();

  // Remove modal
  const bg=document.getElementById('np-modal-bg');
  if(bg)bg.remove();

  // Open the new project
  openWorkspace(id);
}

// Populate an existing (empty) project with the standard template tasks
async function seedTemplateTasksForCurrentProject(){
  if(appMode!=='project'||!currentProjectId)return;
  if(!canManageProject())return;
  if(!confirm('Load the standard ALUM template ('+TASKS_RAW.length+' tasks) into this project? This is meant for projects that currently have no tasks.'))return;

  const btn=document.getElementById('seed-template-btn');
  if(btn){btn.disabled=true;btn.textContent='Loading tasks…';}

  const clonedTasks=TASKS_RAW.map(t=>({
    ...t,
    deps:[...t.deps],
    phase:t.phase||getPhase(t.monthsOut),
    status:'Not Started',
    responsible:t.responsible||'',
    duration:null,
    _custom:false
  }));

  await _seedTasksToSupabase(currentProjectId,clonedTasks);
  TASKS=clonedTasks;
  _rebuildMap();
  localStorage.setItem(_projectTasksKey(),JSON.stringify(_taskRowsForStorage()));
  render();
}

// Add any TASKS_RAW template tasks whose IDs aren't already in this project,
// without touching or resetting any existing tasks (safe for in-progress projects).
async function addMissingTemplateTasksForCurrentProject(){
  if(appMode!=='project'||!currentProjectId)return;
  if(!canManageProject())return;

  const existingIds=new Set(TASKS.map(t=>t.id));
  const missing=TASKS_RAW.filter(t=>!existingIds.has(t.id));

  if(!missing.length){
    alert('No new template tasks to add — this project already has all '+TASKS_RAW.length+' template tasks.');
    return;
  }

  if(!confirm('Add '+missing.length+' new template task(s) to this project? Existing tasks will not be changed.'))return;

  const btn=document.querySelector('[onclick="addMissingTemplateTasksForCurrentProject()"]');
  if(btn){btn.disabled=true;btn.textContent='Syncing…';}

  const clonedTasks=missing.map(t=>({
    ...t,
    deps:[...t.deps],
    phase:t.phase||getPhase(t.monthsOut),
    status:'Not Started',
    responsible:t.responsible||'',
    duration:null,
    _custom:false
  }));

  await _seedTasksToSupabase(currentProjectId,clonedTasks);
  TASKS=[...TASKS,...clonedTasks];
  _rebuildMap();
  localStorage.setItem(_projectTasksKey(),JSON.stringify(_taskRowsForStorage()));
  render();
  alert('Added '+missing.length+' new task(s) to this project.');
}

// ── PHASE FILTER BAR (shared) ─────────────────────────────
function buildPhaseBar(currentFilter,onSelect){
  const bar=document.createElement('div');
  bar.className='phase-bar';

  // "All Phases" pill
  const allPill=document.createElement('span');
  allPill.className='phase-pill'+(currentFilter===''?' active':'');
  allPill.style.cssText=`background:${currentFilter===''?'#1a1a2e':'#e2e8f0'};color:${currentFilter===''?'#fff':'#4a5568'};border-color:${currentFilter===''?'#1a1a2e':'transparent'}`;
  allPill.textContent='All Phases';
  allPill.onclick=()=>onSelect('');
  bar.appendChild(allPill);

  PHASES.forEach(ph=>{
    const col=PHASE_COLORS[ph]||'#a0aec0';
    const isActive=currentFilter===ph;
    const pill=document.createElement('span');
    pill.className='phase-pill'+(isActive?' active':'');
    pill.style.cssText=`background:${isActive?col:col+'20'};color:${isActive?'#fff':col};border-color:${isActive?col:col+'40'}`;
    pill.textContent=ph;
    pill.onclick=()=>onSelect(ph);
    bar.appendChild(pill);
  });
  return bar;
}

// ── DASHBOARD ─────────────────────────────────────────────
function buildDashboard(){
  const wrap=document.createElement('div');
  wrap.className='dash-wrap';

  // ── Empty-project banner ──
  if(TASKS.length===0){
    const empty=document.createElement('div');
    empty.className='dash-card';
    if(canManageProject()){
      empty.innerHTML=`
        <div style="text-align:center;padding:24px 12px;">
          <div style="font-size:18px;font-weight:700;margin-bottom:8px;">This project has no tasks yet</div>
          <div style="color:#718096;margin-bottom:16px;">Load the standard ALUM template (${TASKS_RAW.length} tasks across all disciplines) to get started, or add tasks manually with "+ New Task".</div>
          <button id="seed-template-btn" class="np-btn-primary" onclick="seedTemplateTasksForCurrentProject()">Load Template Tasks</button>
        </div>`;
    }else{
      empty.innerHTML=`
        <div style="text-align:center;padding:24px 12px;">
          <div style="font-size:18px;font-weight:700;margin-bottom:8px;">This project has no tasks yet</div>
          <div style="color:#718096;">Ask the project owner to load the template tasks to get started.</div>
        </div>`;
    }
    wrap.appendChild(empty);
    return wrap;
  }

  // Phase bar
  wrap.appendChild(buildPhaseBar(phaseFilter,(ph)=>{
    phaseFilter=ph;
    currentPage=0;
    render();
  }));

  // ── Compute global stats ──
  const all=TASKS.filter(t=>!t.parentId).filter(t=>{
    if(!phaseFilter)return true;
    return (t.phase||getPhase(t.monthsOut))===phaseFilter;
  });
  const total=all.length;
  const completed=all.filter(t=>t.status==='Completed').length;
  const inProg=all.filter(t=>t.status==='In Progress').length;
  const notStarted=all.filter(t=>t.status==='Not Started').length;
  const blocked=all.filter(t=>t.status==='Blocked').length;
  const na=all.filter(t=>t.status==='N/A').length;
  const pct=total>0?Math.round((completed/total)*100):0;
  const segComp=total>0?(completed/total*100).toFixed(2):0;
  const segIP=total>0?(inProg/total*100).toFixed(2):0;
  const segBl=total>0?(blocked/total*100).toFixed(2):0;

  // ── Per-discipline stats ──
  const discStats=DISCIPLINES.map(d=>{
    const dt=all.filter(t=>t.discipline===d);
    const dc=dt.filter(t=>t.status==='Completed').length;
    const di=dt.filter(t=>t.status==='In Progress').length;
    const dns=dt.filter(t=>t.status==='Not Started').length;
    const dp=dt.length>0?Math.round((dc/dt.length)*100):0;
    return {disc:d,total:dt.length,completed:dc,inProg:di,notStarted:dns,pct:dp};
  }).filter(d=>d.total>0);

  // ── 1. Overall progress card ──
  const ovrCard=document.createElement('div');
  ovrCard.className='dash-card';
  ovrCard.innerHTML=`
    <div class="ovr-hdr">
      <div class="ovr-title">Overall Pre-Opening Progress</div>
      <div class="ovr-pct" style="color:#e94560">${pct}%</div>
    </div>
    <div class="ovr-bar-track">
      <div class="ovr-bar-seg" style="left:0;width:${segComp}%;background:#48bb78"></div>
      <div class="ovr-bar-seg" style="left:${segComp}%;width:${segIP}%;background:#4299e1"></div>
      <div class="ovr-bar-seg" style="left:calc(${segComp}% + ${segIP}%);width:${segBl}%;background:#fc8181"></div>
    </div>
    <div class="ovr-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#48bb78"></div>${completed} completed</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4299e1"></div>${inProg} in progress</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fbd38d"></div>${notStarted} not started</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fc8181"></div>${blocked} blocked</div>
      <div class="legend-item"><div class="legend-dot" style="background:#a0aec0"></div>${na} N/A</div>
    </div>`;
  wrap.appendChild(ovrCard);

  // ── 2. Four stat cards ──
  const statRow=document.createElement('div');
  statRow.className='stat-row';
  const stats=[
    {num:total.toLocaleString(),lbl:'Unique Tasks',col:'#7c3aed'},
    {num:completed,lbl:'Completed',col:'#38a169'},
    {num:inProg,lbl:'In Progress',col:'#3182ce'},
    {num:notStarted,lbl:'Not Started',col:'#e94560'},
  ];
  statRow.innerHTML=stats.map(s=>`
    <div class="stat-card">
      <div class="stat-num" style="color:${s.col}">${s.num}</div>
      <div class="stat-lbl">${s.lbl}</div>
    </div>`).join('');
  wrap.appendChild(statRow);

  // ── 3. Discipline cards ──
  const discSection=document.createElement('div');
  const discGrid=document.createElement('div');
  discGrid.className='disc-cards-grid';
  discSection.innerHTML=`<div class="disc-section-hdr">Progress by Discipline — Click to View Tasks</div>`;
  discStats.forEach(d=>{
    const col=DISC_COLORS[d.disc]||'#a0aec0';
    const card=document.createElement('div');
    card.className='disc-card';
    card.onclick=()=>jumpToDisc(d.disc);
    card.innerHTML=`
      <div class="disc-card-hdr">
        <div class="disc-card-name">${d.disc}</div>
        <div class="disc-card-pct" style="color:${col}">${d.pct}%</div>
      </div>
      <div class="disc-card-bar-track">
        <div class="disc-card-bar-fill" style="width:${d.pct}%;background:${col}"></div>
      </div>
      <div class="disc-card-stats">
        <div class="disc-stat-item"><div class="disc-stat-dot" style="background:#48bb78"></div>${d.completed} done</div>
        <div class="disc-stat-item"><div class="disc-stat-dot" style="background:#4299e1"></div>${d.inProg} in prog</div>
        <div class="disc-stat-item"><div class="disc-stat-dot" style="background:#fc8181"></div>${d.notStarted} pending</div>
      </div>`;
    discGrid.appendChild(card);
  });
  discSection.appendChild(discGrid);
  wrap.appendChild(discSection);

  // ── 4. Overdue + Upcoming widgets ──
  const now=new Date(); now.setHours(0,0,0,0);
  const soon90=new Date(now); soon90.setDate(soon90.getDate()+90);

  const overdue=all.filter(t=>{
    if(t.status==='Completed'||t.status==='N/A')return false;
    const bd=calcBeginDateObj(t.monthsOut);
    return bd&&bd<now;
  }).sort((a,b)=>(a.monthsOut||0)-(b.monthsOut||0));

  const upcoming=all.filter(t=>{
    if(t.status==='Completed'||t.status==='N/A')return false;
    const bd=calcBeginDateObj(t.monthsOut);
    return bd&&bd>=now&&bd<=soon90;
  }).sort((a,b)=>{
    const ba=calcBeginDateObj(a.monthsOut),bb=calcBeginDateObj(b.monthsOut);
    return ba-bb;
  }).slice(0,8);

  const widgetRow=document.createElement('div');
  widgetRow.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:14px';

  // Overdue card
  const overdueCard=document.createElement('div');
  overdueCard.className='dash-card';
  overdueCard.innerHTML=`<div class="dash-card-title" style="color:${overdue.length>0?'#e94560':'#718096'}">
    ${overdue.length>0?'⚠ ':''}Overdue Tasks (${overdue.length})
  </div>`;
  if(overdue.length===0){
    overdueCard.innerHTML+=`<div style="font-size:13px;color:#48bb78;font-weight:600;padding:8px 0">✓ All tasks are on track</div>`;
  } else {
    const listEl=document.createElement('div');
    listEl.style.cssText='display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto';
    overdue.slice(0,10).forEach(t=>{
      const col=DISC_COLORS[t.discipline]||'#a0aec0';
      const bd=calcBeginDate(t.monthsOut);
      const item=document.createElement('div');
      item.style.cssText='display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff5f5;border-radius:7px;cursor:pointer;border-left:3px solid #e94560';
      item.onclick=()=>jumpToTask(t.id);
      item.innerHTML=`
        <div style="flex:1;overflow:hidden">
          <div style="font-size:12px;font-weight:600;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(t.item)}</div>
          <div style="font-size:10px;color:#718096;margin-top:1px">${t.id} · was due ${bd}</div>
        </div>
        <span style="padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;background:${col}20;color:${col};white-space:nowrap">${DISC_PREFIXES[t.discipline]||''}</span>`;
      listEl.appendChild(item);
    });
    if(overdue.length>10){
      listEl.innerHTML+=`<div style="font-size:11px;color:#a0aec0;text-align:center;padding:4px">+${overdue.length-10} more overdue tasks</div>`;
    }
    overdueCard.appendChild(listEl);
  }
  widgetRow.appendChild(overdueCard);

  // Upcoming card
  const upcomingCard=document.createElement('div');
  upcomingCard.className='dash-card';
  upcomingCard.innerHTML=`<div class="dash-card-title">Upcoming Tasks — Next 90 Days (${upcoming.length})</div>`;
  if(upcoming.length===0){
    upcomingCard.innerHTML+=`<div style="font-size:13px;color:#a0aec0;padding:8px 0">No tasks starting in the next 90 days.</div>`;
  } else {
    const listEl=document.createElement('div');
    listEl.style.cssText='display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto';
    upcoming.forEach(t=>{
      const col=DISC_COLORS[t.discipline]||'#a0aec0';
      const bd=calcBeginDate(t.monthsOut);
      const bdObj=calcBeginDateObj(t.monthsOut);
      const daysAway=bdObj?Math.round((bdObj-now)/(1000*60*60*24)):null;
      const urgency=daysAway!==null&&daysAway<=14?'#fff8e1':(daysAway<=30?'#f0f9ff':'#f7fafc');
      const item=document.createElement('div');
      item.style.cssText=`display:flex;align-items:center;gap:8px;padding:7px 10px;background:${urgency};border-radius:7px;cursor:pointer;border-left:3px solid ${col}`;
      item.onclick=()=>jumpToTask(t.id);
      item.innerHTML=`
        <div style="flex:1;overflow:hidden">
          <div style="font-size:12px;font-weight:600;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(t.item)}</div>
          <div style="font-size:10px;color:#718096;margin-top:1px">${t.id} · ${bd}${daysAway!==null?' (in '+daysAway+'d)':''}</div>
        </div>
        <span style="padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;background:${col}20;color:${col};white-space:nowrap">${DISC_PREFIXES[t.discipline]||''}</span>`;
      listEl.appendChild(item);
    });
    upcomingCard.appendChild(listEl);
  }
  widgetRow.appendChild(upcomingCard);
  wrap.appendChild(widgetRow);

  return wrap;
}


function jumpToTask(tid){
  // Switch to All Tasks, set search to task ID, open modal
  switchView('all',null,null);
  searchQuery=tid;
  setTimeout(()=>{
    const si=document.getElementById('tbl-search');
    if(si)si.value=tid;
    _refreshTableBody(TASKS);
    openTaskModal(tid);
  },50);
}
function jumpToDisc(disc){
  discFilter=disc;
  switchView('all',null,null);
  setTimeout(()=>{
    const df=document.getElementById('tbl-disc-filter');
    if(df){df.value=disc;discFilter=disc;_refreshTableBody(TASKS);}
  },50);
}

// ── TABLE VIEW ────────────────────────────────────────────
function buildDisplayOrder(tasks){
  // Parents first, then their children immediately after
  const roots=tasks.filter(t=>!t.parentId);
  const children={};
  tasks.filter(t=>t.parentId).forEach(t=>{
    if(!children[t.parentId])children[t.parentId]=[];
    children[t.parentId].push(t);
  });
  const result=[];
  roots.forEach(t=>{
    result.push(t);
    if(children[t.id])result.push(...children[t.id]);
  });
  // Add orphan children (parent deleted/moved)
  tasks.filter(t=>t.parentId&&!TASK_MAP[t.parentId]).forEach(t=>result.push(t));
  return result;
}

function _getFilteredTasks(allTasks){
  const q=searchQuery.toLowerCase();
  let tasks=allTasks;
  if(phaseFilter) tasks=tasks.filter(t=>(t.phase||getPhase(t.monthsOut))===phaseFilter);
  if(discFilter) tasks=tasks.filter(t=>t.discipline===discFilter);
  if(q){
    const matchIds=new Set();
    tasks.forEach(t=>{
      const hit=t.item.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)||
        (t.discipline||'').toLowerCase().includes(q)||(t.responsible||'').toLowerCase().includes(q);
      if(hit) matchIds.add(t.id);
    });
    tasks.forEach(t=>{if(t.parentId&&matchIds.has(t.id))matchIds.add(t.parentId);});
    tasks=tasks.filter(t=>matchIds.has(t.id));
  }
  if(statusFilter) tasks=tasks.filter(t=>t.status===statusFilter);
  return buildDisplayOrder(tasks);
}

// Pre-compute children map for a task list
function _childrenOf(tasks){
  const m={};
  tasks.forEach(t=>{if(t.parentId){if(!m[t.parentId])m[t.parentId]=[];m[t.parentId].push(t);}});
  return m;
}

// Toggle expand/collapse of a parent row in the table
function toggleTblParent(tid,e){
  if(e)e.stopPropagation();
  if(tblExpanded.has(tid))tblExpanded.delete(tid);
  else tblExpanded.add(tid);
  // Find allTasks from current view
  let tasks=TASKS;
  if(currentView==='disc'&&currentDisc)tasks=tasks.filter(t=>t.discipline===currentDisc);
  _refreshTableBody(tasks);
}

// Expand all / collapse all
function expandAllTbl(allTasks){
  _childrenOf(allTasks);
  allTasks.filter(t=>!t.parentId).forEach(t=>{
    const kids=allTasks.filter(k=>k.parentId===t.id);
    if(kids.length)tblExpanded.add(t.id);
  });
  _refreshTableBody(allTasks);
}
function collapseAllTbl(allTasks){
  tblExpanded.clear();
  _refreshTableBody(allTasks);
}

function _refreshTableBody(allTasks){
  const body=document.getElementById('tbl-body');
  const pg=document.getElementById('tbl-pagination');
  const showing=document.getElementById('tbl-showing');
  if(!body)return;

  // Get tasks passing filters (search may force-expand parents)
  const filtered=_getFilteredTasks(allTasks);

  // Build children map for visible set
  const childMap=_childrenOf(filtered);

  // Determine which rows are actually visible:
  // - All parent tasks (no parentId)
  // - Subtasks whose parent is in tblExpanded  OR  a search is active (auto-show matched subs)
  const isSearching=searchQuery.trim()!==''||statusFilter!=='';
  const visible=[];
  filtered.forEach(t=>{
    if(!t.parentId){visible.push(t);}
    else{
      // Show if searching (parent was already included above) or parent explicitly expanded
      if(isSearching||tblExpanded.has(t.parentId)) visible.push(t);
    }
  });

  const total=visible.length;
  const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage>=totalPages)currentPage=totalPages-1;
  const slice=visible.slice(currentPage*PAGE_SIZE,(currentPage+1)*PAGE_SIZE);

  // Count hidden subtasks for showing line
  const hiddenSubs=filtered.filter(t=>t.parentId&&!isSearching&&!tblExpanded.has(t.parentId)).length;
  const parentCount=filtered.filter(t=>!t.parentId).length;
  if(showing){
    const end=Math.min((currentPage+1)*PAGE_SIZE,total);
    let txt=`Showing ${end} of ${total} tasks`;
    if(hiddenSubs>0) txt+=` · ${hiddenSubs} subtask${hiddenSubs!==1?'s':''} hidden — <a href="#" onclick="expandAllTbl(window._curAllTasks||TASKS);return false;" style="color:#4c6ef5;text-decoration:none">expand all</a>`;
    showing.innerHTML=txt;
  }

  // Build rows HTML
  const isAll=currentView==='all';
  let html='';
  slice.forEach(t=>{
    const isSub=!!t.parentId;
    const kids=childMap[t.id]||[];
    const hasKids=kids.length>0;
    const isExpanded=tblExpanded.has(t.id);
    const beginDate=calcBeginDate(t.monthsOut);
    const endDate=calcEndDate(t.monthsOut,t.duration);
    const col=DISC_COLORS[t.discipline]||'#a0aec0';
    const sCls=statusClass(t.status);
    const cmtCount=_cntC(t.id);
    const cmtCls=cmtCount>0?'cmt-badge has-cmts':'cmt-badge';

    // Task name cell — caret lives here, ⋮ always stays in col 1
    let taskName='';
    if(isSub){
      taskName=`<span class="task-name sub-indent">${escHtml(t.item)}</span>`;
    } else if(hasKids&&!isSearching){
      const caret=`<button class="caret-btn${isExpanded?' expanded':''}" onclick="toggleTblParent('${t.id}',event)" title="${isExpanded?'Collapse':'Expand'} subtasks">${isExpanded?'▾':'▶'}</button>`;
      taskName=`<span class="task-name-wrap">${caret}<span class="task-name" style="font-weight:600">${escHtml(t.item)}<span class="sub-count-badge">${kids.length} subtask${kids.length!==1?'s':''}</span></span></span>`;
    } else {
      taskName=`<span class="task-name">${escHtml(t.item)}</span>`;
    }

    const tPhase=t.phase||getPhase(t.monthsOut);
    const phCol=PHASE_COLORS[tPhase]||'#a0aec0';
    const editable=canEditTask(t);
    const dis=editable?'':'disabled';
    html+=`<tr class="${isSub?'sub-row':''}" data-tid="${t.id}">
      <td>${editable?`<button class="row-menu-btn" onclick="openRowMenu(event,'${t.id}')" title="Task options">⋮</button>`:''}</td>
      <td class="td-id" style="border-left:3px solid ${col}">${t.id}</td>
      ${isAll?`<td class="td-disc"><span class="disc-badge" style="background:${col}20;color:${col}">${DISC_PREFIXES[t.discipline]||t.discipline}</span></td>`:''}
      <td class="td-task" onclick="openTaskModal('${t.id}')" style="cursor:pointer">${taskName}</td>
      <td><span style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;background:${phCol}18;color:${phCol};white-space:nowrap">${tPhase.split(' ').map(w=>w[0]).join('')}</span></td>
      <td class="td-num">${t.monthsOut!=null?t.monthsOut:'—'}</td>
      <td class="td-date">${beginDate}</td>
      <td class="td-date" id="end-${t.id}">${endDate}</td>
      <td><input class="dur-input" type="number" min="1" max="999" placeholder="days" ${dis}
        value="${t.duration||''}" onchange="handleDurationChange('${t.id}',this.value)" title="Duration in days"></td>
      <td class="td-resp"><select ${dis} onchange="handleRespChange('${t.id}',this.value)">${_respOptionsHtml(t.responsible)}</select></td>
      <td><select class="status-sel ${sCls}" onchange="handleStatusChange(event,'${t.id}')" ${dis}>${statusOptions(t.status)}</select></td>
      <td class="td-deps">${editable?depsCell(t):(t.deps&&t.deps.length?`<div class="dep-chips-cell">${t.deps.map(did=>`<span class="dep-chip-sm">${did}</span>`).join('')}</div>`:'—')}</td>
      <td style="text-align:center"><span class="${cmtCls}" onclick="openTaskModal('${t.id}')" title="Comments">${cmtCount||'💬'}</span></td>
    </tr>`;
  });
  body.innerHTML=html;

  // Pagination controls
  if(pg){
    pg.innerHTML=`
      <button class="pg-btn" onclick="gotoPage(${currentPage-1},event)" ${currentPage===0?'disabled':''}>← Prev</button>
      <span class="pg-info">Page ${currentPage+1} of ${totalPages}</span>
      <button class="pg-btn" onclick="gotoPage(${currentPage+1},event)" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;
  }
}

// Store reference to current allTasks for pagination
let _curAllTasks=null;
function gotoPage(pg,e){
  e&&e.stopPropagation();
  // Find current allTasks from view
  let tasks=TASKS;
  if(currentView==='disc'&&currentDisc)tasks=tasks.filter(t=>t.discipline===currentDisc);
  _curAllTasks=tasks;
  currentPage=pg;
  _refreshTableBody(tasks);
}

function statusClass(s){
  return s==='Not Started'?'s-ns':s==='In Progress'?'s-ip':s==='Completed'?'s-co':s==='Blocked'?'s-bl':'s-na';
}
function statusOptions(cur){
  return ['Not Started','In Progress','Completed','Blocked','N/A'].map(s=>
    `<option value="${s}"${s===cur?' selected':''}>${s}</option>`).join('');
}
function depsCell(t){
  const arr=t.deps||[];
  if(arr.length===0)return `<button class="dep-btn" onclick="openDepPicker('${t.id}',event)">+ Add Dep</button>`;
  const chips=arr.map(did=>`<span class="dep-chip-sm">${did}</span>`).join('');
  return `<div class="dep-chips-cell">${chips}<button class="dep-btn" onclick="openDepPicker('${t.id}',event)" style="margin-left:3px">✎</button></div>`;
}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── STATUS HANDLER ────────────────────────────────────────
function handleStatusChange(event,taskId){
  const t=TASK_MAP[taskId];if(!t)return;
  t.status=event.target.value;
  event.target.className='status-sel '+statusClass(t.status);
  _persist();
}
function handleRespChange(taskId,val){
  const t=TASK_MAP[taskId];if(!t)return;
  t.responsible=val;
  _persist();
}
function handleItemChange(taskId,val){
  const t=TASK_MAP[taskId];if(!t)return;
  const trimmed=val.trim();
  if(!trimmed)return; // don't allow blank name
  t.item=trimmed;
  _persist();
  // Update table row task cell in-place (no full re-render)
  const row=document.querySelector(`tr[data-tid="${taskId}"] .td-task`);
  if(row){
    const isSub=!!t.parentId;
    const hasKids=TASKS.some(k=>k.parentId===taskId);
    let inner='';
    if(isSub) inner=`<span class="task-name sub-indent">${escHtml(t.item)}</span>`;
    else if(hasKids) inner=`<span class="task-name" style="font-weight:600">${escHtml(t.item)}</span>`;
    else inner=`<span class="task-name">${escHtml(t.item)}</span>`;
    row.innerHTML=inner;
    row.onclick=()=>openTaskModal(taskId);
    row.style.cursor='pointer';
  }
  // Update modal textarea value to trimmed version
  const ta=document.getElementById('modal-item-'+taskId);
  if(ta)ta.value=trimmed;
}

// ── DURATION HANDLER ──────────────────────────────────────
function handleDurationChange(taskId,val){
  const t=TASK_MAP[taskId];if(!t)return;
  const days=parseInt(val,10);
  t.duration=(isNaN(days)||days<=0)?null:days;
  const endEl=document.getElementById('end-'+taskId);
  if(endEl)endEl.textContent=calcEndDate(t.monthsOut,t.duration);
  const mEnd=document.getElementById('modal-end-'+taskId);
  if(mEnd)mEnd.textContent=calcEndDate(t.monthsOut,t.duration);
  const mDurLbl=document.getElementById('modal-dur-lbl-'+taskId);
  if(mDurLbl)mDurLbl.textContent=t.duration?' (≈'+durationLabel(t.duration)+')':'';
  _persist();
}

// ── ROW MENU ─────────────────────────────────────────────
function openRowMenu(event,taskId){
  event.stopPropagation();
  _menuTid=taskId;
  const rm=document.getElementById('row-menu');
  if(!rm)return;
  // Collaborators (RLS) cannot delete tasks — hide that option for them
  const canDelete=appMode==='template'||currentProjectRole==='owner'||currentProjectRole==='admin'||currentProjectRole==='editor';
  rm.innerHTML=`
    <button class="row-menu-item" onclick="createSubTask(_menuTid)">↳ Create Sub Task</button>
    <button class="row-menu-item" onclick="duplicateTask(_menuTid)">⊕ Duplicate Task</button>
    <button class="row-menu-item" onclick="openMoveToDialog(_menuTid)">→ Move To…</button>
    ${canDelete?`<div class="row-menu-div"></div>
    <button class="row-menu-item row-menu-danger" onclick="deleteTask(_menuTid)">🗑 Delete Task</button>`:''}`;
  const btn=event.currentTarget;
  const rect=btn.getBoundingClientRect();
  rm.style.top=(rect.bottom+4)+'px';
  rm.style.left=Math.min(rect.left,window.innerWidth-180)+'px';
  rm.classList.add('open');
}
function closeRowMenu(){
  const rm=document.getElementById('row-menu');
  if(rm)rm.classList.remove('open');
}

function createSubTask(tid){
  closeRowMenu();
  const parent=TASK_MAP[tid];if(!parent)return;
  _newTaskDefaults={parentId:tid,discipline:parent.discipline,monthsOut:parent.monthsOut};
  openNewTaskForm(_newTaskDefaults);
}

function duplicateTask(tid){
  closeRowMenu();
  const src=TASK_MAP[tid];if(!src)return;
  const disc=src.discipline;
  const prefix=DISC_PREFIXES[disc]||disc.slice(0,3).toUpperCase();
  // Find next ID
  const existing=TASKS.filter(t=>t.id.startsWith(prefix+'-')).map(t=>parseInt(t.id.split('-')[1]||0)).filter(n=>!isNaN(n));
  const nextNum=(existing.length?Math.max(...existing):0)+1;
  const newId=`${prefix}-${String(nextNum).padStart(3,'0')}`;
  const dup={
    id:newId,
    discipline:src.discipline,
    item:'Copy of '+src.item,
    monthsOut:src.monthsOut,
    responsible:src.responsible||'',
    status:'Not Started',
    deps:[...src.deps],
    duration:src.duration,
    parentId:src.parentId||null,
    _custom:true
  };
  TASKS.push(dup);
  TASK_MAP[dup.id]=dup;
  _persist();
  render();
}

function openMoveToDialog(tid){
  closeRowMenu();
  if(appMode==='project'&&currentProjectRole==='collaborator'&&currentProjectDiscipline){
    alert('Your access is limited to the '+currentProjectDiscipline+' discipline, so you cannot move tasks to a different discipline.');
    return;
  }
  _moveTid=tid;
  const t=TASK_MAP[tid];if(!t)return;
  const md=document.getElementById('move-dialog');
  const opts=document.getElementById('move-opts');
  opts.innerHTML=DISCIPLINES.map(d=>
    `<button class="move-opt${d===t.discipline?' move-opt-cur':''}" onclick="confirmMove('${tid}','${d.replace(/'/g,"\\'")}')">${d}</button>`
  ).join('');
  md.style.display='flex';
}
function closeMoveDialog(){
  const md=document.getElementById('move-dialog');
  if(md)md.style.display='';
  _moveTid=null;
}
function confirmMove(tid,disc){
  const t=TASK_MAP[tid];
  if(t){
    t.discipline=disc;
    // Also update sub-tasks if they're in the same discipline
    _persist();
    render();
  }
  closeMoveDialog();
}

function deleteTask(tid){
  closeRowMenu();
  const t=TASK_MAP[tid];if(!t)return;
  if(appMode==='project'&&!(currentProjectRole==='owner'||currentProjectRole==='admin'||currentProjectRole==='editor')){
    alert('You do not have permission to delete tasks in this project.');
    return;
  }
  const childCount=TASKS.filter(c=>c.parentId===tid).length;
  const msg=childCount>0
    ?`Delete "${t.item}" and its ${childCount} sub-task(s)?`
    :`Delete "${t.item}"?`;
  if(!confirm(msg))return;
  // Remove children
  TASKS=TASKS.filter(c=>c.parentId!==tid);
  // Remove task
  TASKS=TASKS.filter(c=>c.id!==tid);
  _rebuildMap();
  _persist();
  render();
}

// ── DEP PICKER ───────────────────────────────────────────
function _buildDepPickerOverlay(){
  const ov=document.createElement('div');
  ov.id='dep-picker-overlay';
  ov.innerHTML=`<div id="dep-picker-box">
    <div class="dp-hdr">
      <div class="dp-title">Select Dependencies</div>
      <button class="modal-close" onclick="closeDepPicker()">×</button>
    </div>
    <div class="dp-filters">
      <input id="dp-search" type="text" placeholder="Search tasks…">
      <select id="dp-disc-filter">
        <option value="">All Disciplines</option>
        ${DISCIPLINES.map(d=>`<option value="${d}">${d}</option>`).join('')}
      </select>
    </div>
    <div id="dp-chips"></div>
    <div id="dp-list"></div>
    <div class="dp-footer">
      <span id="dp-count" style="font-size:12px;color:#718096"></span>
      <button id="dp-done-btn" onclick="_confirmDepPicker()">Done (0 selected)</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  document.getElementById('dp-search').addEventListener('input',_updateDepPickerResults);
  document.getElementById('dp-disc-filter').addEventListener('change',_updateDepPickerResults);
}

function openDepPicker(ctx,event){
  event&&event.stopPropagation();
  _pickerCtx=ctx;
  const t=TASK_MAP[ctx];
  _pickerSel=t?[...t.deps]:[];
  document.getElementById('dp-search').value='';
  document.getElementById('dp-disc-filter').value='';
  _updateDepPickerResults();
  document.getElementById('dep-picker-overlay').classList.add('open');
}
function closeDepPicker(){document.getElementById('dep-picker-overlay').classList.remove('open');}

function _updateDepPickerResults(){
  const q=(document.getElementById('dp-search').value||'').toLowerCase();
  const disc=document.getElementById('dp-disc-filter').value;
  const excludeId=TASK_MAP[_pickerCtx]?_pickerCtx:null;

  let list=TASKS.filter(t=>
    t.id!==excludeId&&
    !t.parentId&&
    (!disc||t.discipline===disc)&&
    (!q||(t.item.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)))
  ).slice(0,80);

  // Chips
  const chipsEl=document.getElementById('dp-chips');
  chipsEl.innerHTML=_pickerSel.map(id=>{
    const st=TASK_MAP[id];
    return `<span class="dp-chip">${id}${st?': '+st.item.slice(0,20)+'…':''}<button class="dp-chip-x" onclick="_pickerRemove('${id}')">×</button></span>`;
  }).join('');

  // List
  const listEl=document.getElementById('dp-list');
  listEl.innerHTML=list.map(t=>{
    const sel=_pickerSel.includes(t.id);
    return `<div class="dp-item${sel?' sel':''}" onclick="_pickerToggle('${t.id}')">
      <input type="checkbox" class="dp-item-cb" ${sel?'checked':''} onclick="event.stopPropagation()">
      <span class="dp-item-id">${t.id}</span>
      <span class="dp-item-name">${escHtml(t.item.slice(0,60))}${t.item.length>60?'…':''}</span>
      <span class="dp-item-disc">${DISC_PREFIXES[t.discipline]||''}</span>
    </div>`;
  }).join('');

  const count=_pickerSel.length;
  document.getElementById('dp-done-btn').textContent=`Done (${count} selected)`;
  document.getElementById('dp-count').textContent=`${list.length} tasks shown`;
}
function _pickerToggle(tid){
  const i=_pickerSel.indexOf(tid);
  if(i>=0)_pickerSel.splice(i,1);
  else _pickerSel.push(tid);
  _updateDepPickerResults();
}
function _pickerRemove(tid){
  _pickerSel=_pickerSel.filter(id=>id!==tid);
  _updateDepPickerResults();
}
function _confirmDepPicker(){
  if(_pickerCtx&&TASK_MAP[_pickerCtx]){
    TASK_MAP[_pickerCtx].deps=[..._pickerSel];
    _persist();
    // Refresh just the deps cell without full render
    const t=TASK_MAP[_pickerCtx];
    const row=document.querySelector(`tr[data-tid="${_pickerCtx}"] .td-deps`);
    if(row)row.innerHTML=depsCell(t);
  }
  closeDepPicker();
}
